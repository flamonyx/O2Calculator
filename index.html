<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>O2Ramp Calculator</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="O2Ramp">
<meta name="application-name" content="O2Ramp">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000000;
  --red:#FE2C39;
  --coral:#FC826A;
  --flare:#FF8E7E;
  --hi:#FFC2B8;
  --ash:#A99C9E;
  --dim:#625759;
  --white:#FFF5F4;
  --stroke:rgba(254,60,70,.26);
  --glass:rgba(254,44,57,.06);
  --grad:linear-gradient(120deg,#FC826A,#FE2C39);
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI','Noto Sans','Noto Sans Thai','Noto Sans Devanagari','PingFang SC','Hiragino Sans','Apple SD Gothic Neo',sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--black)}
html,body{margin:0;min-height:100%}
body{background:var(--black);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
img{max-width:100%;display:block;-webkit-user-drag:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- atmosphere ---------- */
#sparks{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.horizon{position:fixed;left:-30%;right:-30%;bottom:-62vh;height:90vh;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(254,44,57,0) 78%,rgba(254,44,57,.22) 92%,rgba(252,130,106,.55) 98.6%,rgba(254,44,57,0) 100%);filter:blur(1px)}
.horizon::after{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(254,44,57,.16),transparent 70%)}

/* ---------- language ---------- */
#langBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;z-index:30;display:flex;align-items:center;gap:7px;
  padding:7px 12px 7px 9px;border-radius:999px;background:rgba(20,4,6,.6);border:1px solid var(--stroke);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:13px;font-weight:600;letter-spacing:.02em}
#langBtn svg.ch{width:10px;height:10px;opacity:.7}
.flag{width:22px;height:15px;border-radius:3px;overflow:hidden;flex:none;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.flag svg{width:100%;height:100%;display:block}
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:480px;background:linear-gradient(180deg,#1c0507,#090102);border:1px solid var(--stroke);border-bottom:0;border-radius:26px 26px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.25,1)}
.sheet-wrap.open .sheet{transform:none}
.sheet .grip{width:42px;height:4px;border-radius:4px;background:var(--dim);margin:4px auto 14px}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-grid button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--glass);border:1px solid transparent;font-size:14px;text-align:left}
.lang-grid button[aria-pressed="true"]{border-color:var(--red);background:rgba(254,44,57,.14)}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:24px;
  transition:opacity .7s ease,transform .9s cubic-bezier(.6,0,.2,1)}
body.entered #splash{opacity:0;transform:scale(1.25);pointer-events:none}
.stage{position:relative;width:min(80vw,340px);aspect-ratio:2;perspective:900px;display:grid;place-items:center}
.ring{position:absolute;left:-8%;right:-8%;top:6%;bottom:6%;border-radius:50%;border:1px solid rgba(254,70,80,.3);transform-style:preserve-3d}
.ring::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--flare);box-shadow:0 0 14px 4px rgba(254,70,80,.85)}
.ring.r1{animation:orbitA 7s linear infinite}
.ring.r2{left:-20%;right:-20%;top:-6%;bottom:-6%;border-color:rgba(254,70,80,.15);animation:orbitB 11s linear infinite}
.ring.r2::before{width:5px;height:5px;margin-left:-2.5px;top:-3px;opacity:.8}
@keyframes orbitA{from{transform:rotateX(74deg) rotateZ(0)}to{transform:rotateX(74deg) rotateZ(360deg)}}
@keyframes orbitB{from{transform:rotateX(68deg) rotateY(-10deg) rotateZ(360deg)}to{transform:rotateX(68deg) rotateY(-10deg) rotateZ(0)}}
.logo3d{position:relative;width:100%;transform-style:preserve-3d;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 18px 30px rgba(254,44,57,.38))}
.logo3d img{width:100%}
.logo3d .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%) no-repeat;background-size:260% 100%;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;animation:shine 4.5s ease-in-out infinite;mix-blend-mode:screen}
@keyframes float{0%,100%{transform:translateY(0) rotateY(-7deg) rotateX(4deg)}50%{transform:translateY(-10px) rotateY(7deg) rotateX(-2deg)}}
@keyframes shine{0%,35%{background-position:130% 0}75%,100%{background-position:-40% 0}}
.club{text-align:center}
.club-top{margin:0 0 6px;font-weight:400;font-size:14px;color:var(--ash);letter-spacing:.02em}
.club-name{margin:0;font-weight:700;font-size:clamp(32px,10vw,44px);letter-spacing:-.01em;line-height:1.15;background:linear-gradient(180deg,#FFE0DA,var(--flare) 45%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(254,44,57,.45))}
.enter{position:relative;padding:15px 46px;border-radius:999px;font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--white);text-align:center;max-width:320px;line-height:1.35;
  background:linear-gradient(180deg,rgba(254,44,57,.34),rgba(110,8,16,.6));box-shadow:0 0 0 1px rgba(254,90,90,.55) inset,0 10px 40px -8px rgba(254,44,57,.7);
  animation:breathe 2.6s ease-in-out infinite;overflow:hidden}
.enter::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,220,215,.35) 50%,transparent 70%);background-size:250% 100%;animation:shine 3s linear infinite}
.enter:active{transform:scale(.97)}
@keyframes breathe{0%,100%{box-shadow:0 0 0 1px rgba(254,90,90,.55) inset,0 10px 40px -8px rgba(254,44,57,.6)}50%{box-shadow:0 0 0 1px rgba(255,150,140,.85) inset,0 12px 60px -6px rgba(254,44,57,.95)}}

/* ---------- app ---------- */
#app{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:16px 18px 48px;opacity:0;transform:translateY(30px);pointer-events:none;transition:opacity .6s .35s,transform .8s .3s cubic-bezier(.2,.9,.25,1)}
body.entered #app{opacity:1;transform:none;pointer-events:auto}
body:not(.entered){overflow:hidden;height:100%}
.horizon,#sparks{transition:opacity .8s}
body.entered .horizon{opacity:0}
body.entered #sparks{opacity:.35}
.brand{display:flex;align-items:center;height:44px}
.brand img{height:30px;width:auto}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:16px 0;padding:4px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--stroke)}
.seg button{position:relative;z-index:1;padding:11px 8px;font-size:14px;font-weight:600;color:var(--ash);transition:color .3s;border-radius:999px}
.seg button[aria-selected="true"]{color:#fff}
.seg .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--grad);box-shadow:0 6px 24px -6px rgba(254,44,57,.9);transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
.seg[data-on="1"] .pill{transform:translateX(100%)}
.panel{display:none}
.panel.on{display:block;animation:panelIn .45s cubic-bezier(.2,.9,.25,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.lbl{font-size:13px;color:var(--ash);margin:0 0 9px}
.group{padding:16px 14px 2px;border-radius:20px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07)}
.group .block{margin:0;padding:0 0 16px}
.group .block+.block{padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:13px 11px 12px;border-radius:16px;background:var(--glass);border:1px solid rgba(255,255,255,.06);text-align:left;transition:border-color .25s,background .25s,transform .15s}
.plan:active{transform:scale(.97)}
.plan .pn{font-size:12px;color:var(--ash);font-weight:500;line-height:1.2;white-space:nowrap}
.plan .pr{font-weight:700;font-size:19px;margin-top:6px;letter-spacing:-.01em;white-space:nowrap}
.plan .pm{font-size:.78em;margin-right:1px;opacity:.8}
.plan .pd{font-size:11px;color:var(--dim)}
.plan .hot{position:absolute;top:-8px;right:8px;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:999px;color:#fff;background:var(--grad);box-shadow:0 0 14px rgba(254,44,57,.8)}
.plan[aria-pressed="true"]{border-color:var(--red);background:linear-gradient(180deg,rgba(254,44,57,.22),rgba(254,44,57,.05))}
.plan[aria-pressed="true"] .pn{color:var(--white)}
.plan[aria-pressed="true"] .pr{color:var(--flare)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--ash);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);transition:.2s}
.chip[aria-pressed="true"]{color:#fff;background:var(--grad);border-color:transparent}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.frow .lbl{margin:0}
.cur{display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.cur button{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ash);transition:.2s}
.cur button[aria-pressed="true"]{background:rgba(254,44,57,.28);color:var(--white)}
.cur button[aria-disabled="true"]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.cur button.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.amt{display:flex;align-items:baseline;gap:8px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid var(--stroke);transition:border-color .2s}
.amt:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(254,44,57,.14)}
.amt.bad{border-color:var(--red)}
.amt input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--white);font-family:var(--sans);font-weight:700;font-size:28px;letter-spacing:-.01em;padding:0;font-variant-numeric:tabular-nums}
.amt .sym{font-size:13px;font-weight:600;color:var(--flare)}
.err{font-size:12.5px;color:var(--flare);margin-top:8px}
.rate{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--ash)}
body.rm .rate{display:flex}
.rate input{width:110px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);color:var(--white);font:600 16px var(--sans);outline:0}
.rate input:focus{border-color:var(--red)}
.rate .eq{color:var(--white);font-weight:500}
.cur .loc-btn{display:inline-flex;align-items:center;gap:6px}
.cur .loc-btn .flag{width:18px;height:12px}
.dline{display:inline-flex;align-items:baseline;gap:6px;margin-top:14px;padding:8px 16px;border-radius:999px;background:rgba(254,44,57,.16);border:1px solid rgba(254,90,90,.32);font-size:14px;color:var(--ash)}
.dline b{font-size:19px;font-weight:700;color:var(--white);font-variant-numeric:tabular-nums}
.dline .cu{font-size:12px;font-weight:600;color:var(--flare)}
body.pre .big .u{order:-1;margin:0 7px 0 0}
.row b{display:inline-flex;align-items:baseline;gap:3px}
body.pre .row b small{order:-1;margin:0 3px 0 0}
.offs{margin-top:10px;padding:10px 12px;border-radius:14px;background:rgba(254,44,57,.08);border:1px solid rgba(254,44,57,.2);font-size:12px;line-height:1.5;color:var(--hi)}
.offs p{margin:0}
.offs p.why{color:var(--ash);margin-top:3px}
.range{width:100%;margin:6px 0 0;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
.range::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--red) var(--p,50%),rgba(255,255,255,.1) var(--p,50%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:var(--flare);box-shadow:0 0 0 5px rgba(254,44,57,.25),0 0 18px rgba(254,44,57,.8)}
.range::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
.range::-moz-range-progress{height:4px;border-radius:4px;background:var(--red)}
.range::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--flare)}
.rv{font-size:15px;font-weight:600;color:var(--white);min-width:92px;text-align:center}
.pv{display:flex;flex-direction:column;align-items:flex-end}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--stroke);font-size:18px;line-height:1;color:var(--flare);display:grid;place-items:center}
.stepper button:active{background:rgba(254,44,57,.3)}
.rsub{font-size:12px;color:var(--flare);margin-top:5px;min-height:15px;padding-right:38px;text-align:right}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:6px}
.dim{opacity:.35;pointer-events:none;filter:grayscale(.6);transition:opacity .3s}
.empty{margin:18px 0 0;padding:14px;border-radius:16px;background:rgba(254,44,57,.08);border:1px solid rgba(254,44,57,.25);font-size:13.5px;color:var(--hi);text-align:center}

/* ---------- result card ---------- */
.hero{margin:22px 0 12px;padding:22px 18px 20px;text-align:center;border-radius:20px;background:linear-gradient(180deg,rgba(254,44,57,.18),rgba(254,44,57,.03));border:1px solid rgba(254,70,80,.4)}
.hero .rl{font-size:13px;color:var(--ash);margin-bottom:10px}
.big{font-variant-numeric:tabular-nums;font-weight:700;line-height:1.1;color:var(--flare);white-space:nowrap;display:inline-flex;justify-content:center;align-items:baseline;letter-spacing:-.02em}
.big .u{font-size:14px;font-weight:600;color:var(--ash);margin-left:7px;letter-spacing:0;align-self:flex-end;padding-bottom:.35em}
.reel{display:inline-block;height:1.1em;overflow:hidden;vertical-align:top}
.strip{display:block;will-change:transform}
.strip span,.sep{display:block;height:1.1em;line-height:1.1em;text-align:center}
.sep{display:inline-block}
.hero .rs{margin-top:10px;font-size:13px;color:var(--ash)}
.hero .rs b{color:var(--white);font-weight:600}
.hero.pulse{animation:flash .8s ease-out}
@keyframes flash{0%{border-color:var(--flare);box-shadow:0 0 30px -6px rgba(254,44,57,.8)}100%{border-color:rgba(254,70,80,.4);box-shadow:none}}

.be{padding:16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:14px}
.be-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ash)}
.be-top b{font-weight:600;font-size:14px;color:var(--white);text-align:right}
.bar{position:relative;height:12px;margin:14px 0 10px;border-radius:12px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .cap,.bar .pro{position:absolute;top:0;bottom:0;transition:width 1s cubic-bezier(.2,.9,.25,1),left 1s cubic-bezier(.2,.9,.25,1)}
.bar .cap{left:0;background:linear-gradient(90deg,rgba(254,44,57,.3),rgba(254,44,57,.5))}
.bar .pro{background:linear-gradient(90deg,var(--red),var(--flare));box-shadow:0 0 16px rgba(254,90,90,.8)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ash);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .end{margin-left:auto}

.rows{border-radius:18px;border:1px solid rgba(255,255,255,.07);overflow:hidden}
.rows .lbl{padding:14px 16px 0;margin:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:13px;color:var(--ash)}
.row:first-child,.rows .lbl+.row{border-top:0}
.row b{font-weight:600;font-size:15px;color:var(--white);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.row b small{font-size:11px;color:var(--ash);font-weight:500;margin-left:3px}
.row small.sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.row.total{background:linear-gradient(90deg,rgba(254,44,57,.18),rgba(254,44,57,.04));color:var(--white)}
.row.total b{font-size:20px;color:var(--flare)}

/* compounding steps */
.steps{margin-top:22px;padding:18px 16px 4px;border-radius:20px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07)}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;position:relative;padding-bottom:20px}
.step:not(.last)::before{content:"";position:absolute;left:14px;top:36px;bottom:6px;width:2px;background:linear-gradient(180deg,rgba(254,44,57,.5),rgba(254,44,57,.08))}
.step.last{padding-bottom:14px}
.dot{width:30px;height:30px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;box-shadow:0 0 16px -2px rgba(254,44,57,.8)}
.rng{display:block;font-size:11.5px;color:var(--dim);font-weight:500}
.st{display:block;font-size:15.5px;font-weight:600;line-height:1.35}
.ss{margin:2px 0 10px;font-size:12.5px;color:var(--ash);line-height:1.45}
.flow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 13px;font-variant-numeric:tabular-nums}
.flow span{font-weight:500;font-size:15px;color:var(--ash)}
.flow svg{width:18px;height:18px;fill:none;stroke:var(--flare);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flow b{font-weight:700;font-size:20px;white-space:nowrap}
.flow small{font-size:11px;font-weight:600;color:var(--ash);margin-left:-4px}
.flow.hot{background:rgba(254,44,57,.1);border-color:rgba(254,44,57,.25)}
.flow.hot span{font-size:13px}
.flow.hot b{color:var(--flare);margin-left:auto}
.step .hero{margin:4px 0 0}

.disc{margin:22px 4px 0;font-size:11px;line-height:1.55;color:var(--dim);text-align:center}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<canvas id="sparks" aria-hidden="true"></canvas>
<div class="horizon" aria-hidden="true"></div>

<button id="langBtn" type="button" aria-label="Language"><span class="flag" id="langFlag"></span><span id="langCode">MS</span><svg class="ch" viewBox="0 0 10 10"><path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>

<section id="splash">
  <div class="stage">
    <div class="ring r2"></div>
    <div class="ring r1"></div>
    <div class="logo3d" id="logo3d"><img class="logoimg" alt="O2Ramp"><div class="shine"></div></div>
  </div>
  <div class="club"><p class="club-top" data-i18n="clubTop"></p><p class="club-name">Performante</p></div>
  <button class="enter" id="enterBtn" type="button" data-i18n="tapHere"></button>
</section>

<main id="app">
  <header class="brand"><img class="logoimg" alt="O2Ramp"></header>

  <div class="seg" id="seg" data-on="0" role="tablist">
    <span class="pill"></span>
    <button role="tab" aria-selected="true" data-tab="0" data-i18n="tabStake"></button>
    <button role="tab" aria-selected="false" data-tab="1" data-i18n="tabComp"></button>
  </div>

  <!-- ===== PASSIVE ===== -->
  <section class="panel on" id="p0">
    <div class="group">
      <div class="block">
        <p class="lbl"><span data-i18n="tierLbl"></span> (USDT)</p>
        <div class="plans">
          <button class="plan" data-tier="0" data-set="100"><span class="pn">100 – 999</span><span class="pr"><span class="pm">±</span>0.36%</span><span class="pd" data-i18n="perDay"></span></button>
          <button class="plan" data-tier="1" data-set="1000"><span class="pn">1K – 9.9K</span><span class="pr"><span class="pm">±</span>0.4%</span><span class="pd" data-i18n="perDay"></span></button>
          <button class="plan" data-tier="2" data-set="10000"><span class="hot">HOT</span><span class="pn">10K +</span><span class="pr"><span class="pm">±</span>0.45%</span><span class="pd" data-i18n="perDay"></span></button>
        </div>
      </div>
      <div class="block">
        <div class="frow"><p class="lbl" data-i18n="amount"></p><div class="cur"><button data-cur="USDT">USDT</button><button data-cur="LOC" class="loc-btn"></button></div></div>
        <label class="amt" id="st-box"><input id="st-amt" inputmode="decimal" autocomplete="off" aria-label="amount"><span class="sym cu">USDT</span></label>
        <div class="err" id="st-err" hidden></div>
        <div class="rate"><span data-i18n="rateLbl"></span><span class="eq">1 USDT =</span><input class="rate-in" inputmode="decimal" aria-label="rate"><span class="rate-sym"></span></div>
        <div class="chips">
          <button class="chip" data-k="st" data-usd="100"></button>
          <button class="chip" data-k="st" data-usd="1000"></button>
          <button class="chip" data-k="st" data-usd="10000"></button>
          <button class="chip" data-k="st" data-usd="50000"></button>
        </div>
      </div>
    </div>

    <div id="st-res">
      <div class="hero" id="st-hero">
        <div class="rl" data-i18n="heroMonth"></div>
        <div class="big"><span id="st-mon"></span><span class="u cu">USDT</span></div>
        <div class="dline"><b id="st-dd">0</b><span class="cu">USDT</span><span data-i18n="perDay"></span></div>
      </div>

      <div class="be">
        <div class="be-top"><span data-i18n="be"></span><b id="st-be"></b></div>
        <div class="bar"><div class="cap" id="st-cap"></div><div class="pro" id="st-pro"></div></div>
        <div class="legend"><span><i style="background:rgba(254,44,57,.5)"></i><span data-i18n="capital"></span></span><span><i style="background:var(--flare)"></i><span data-i18n="profit"></span></span><span class="end" data-i18n="contract"></span></div>
      </div>

      <div class="rows">
        <div class="row"><span data-i18n="week"></span><b><span id="st-w"></span><small class="cu">USDT</small></b></div>
        <div class="row"><span data-i18n="year"></span><b><span id="st-y"></span><small class="cu">USDT</small></b></div>
        <div class="row total"><span><span data-i18n="grand"></span><small class="sub" data-i18n="grandSub"></small></span><b><span id="st-grand"></span><small class="cu">USDT</small></b></div>
      </div>
    </div>
    <p class="disc" data-i18n="disc"></p>
  </section>

  <!-- ===== COMPOUNDING ===== -->
  <section class="panel" id="p1">
    <div class="group">
      <div class="block">
        <div class="frow"><p class="lbl" data-i18n="amount"></p><div class="cur"><button data-cur="USDT">USDT</button><button data-cur="LOC" class="loc-btn"></button></div></div>
        <label class="amt" id="cp-box"><input id="cp-amt" inputmode="decimal" autocomplete="off" aria-label="amount"><span class="sym cu">USDT</span></label>
        <div class="err" id="cp-err" hidden></div>
        <div class="rate"><span data-i18n="rateLbl"></span><span class="eq">1 USDT =</span><input class="rate-in" inputmode="decimal" aria-label="rate"><span class="rate-sym"></span></div>
        <div class="chips">
          <button class="chip" data-k="cp" data-usd="1000"></button>
          <button class="chip" data-k="cp" data-usd="5000"></button>
          <button class="chip" data-k="cp" data-usd="25000"></button>
          <button class="chip" data-k="cp" data-usd="100000"></button>
        </div>
      </div>
      <div class="block" id="cp-opts">
        <div class="frow"><p class="lbl" data-i18n="compEvery"></p>
          <div class="cur" id="cp-every"><button data-every="1" data-i18n="fDay"></button><button data-every="7" data-i18n="fWeek"></button><button data-every="30" data-i18n="fMonth"></button></div></div>
        <div class="offs" id="cp-offs" hidden></div>
        <div id="cp-period">
          <div class="frow" style="margin:16px 0 0;align-items:flex-start"><p class="lbl" data-i18n="period" style="padding-top:6px"></p>
            <div class="pv"><div class="stepper"><button data-step="-1" aria-label="-">−</button><span class="rv" id="cp-rv"></span><button data-step="1" aria-label="+">+</button></div><div class="rsub" id="cp-rsub"></div></div></div>
          <input type="range" class="range" id="cp-range" min="1" max="364" step="1" value="180" aria-label="period">
          <div class="axis"><span id="cp-min"></span><span id="cp-max"></span></div>
        </div>
      </div>
    </div>

    <p class="empty" id="cp-empty" hidden></p>
    <div id="cp-res">
      <div class="steps">
        <div class="step">
          <span class="dot">1</span>
          <div><span class="rng" id="s1r"></span><b class="st" id="s1t"></b><p class="ss" data-i18n="s1_s"></p>
            <div class="flow"><span id="s1a"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg><b id="s1b"></b><small class="cu">USDT</small></div></div>
        </div>
        <div class="step">
          <span class="dot">2</span>
          <div><span class="rng" id="s2r"></span><b class="st" data-i18n="s2_t"></b><p class="ss" id="s2s"></p>
            <div class="flow hot"><span data-i18n="s2_r"></span><b id="s2v"></b><small class="cu">USDT</small></div></div>
        </div>
        <div class="step last">
          <span class="dot">3</span>
          <div><span class="rng" data-i18n="day365"></span>
            <div class="hero" id="cp-hero">
              <div class="rl" data-i18n="s3_t"></div>
              <div class="big"><span id="cp-total"></span><span class="u cu">USDT</span></div>
              <div class="rs" id="s3s"></div>
            </div></div>
        </div>
      </div>

      <div class="rows" style="margin-top:14px">
        <p class="lbl" data-i18n="cmpTitle"></p>
        <div class="row"><span data-i18n="withC"></span><b><span id="cp-with"></span><small class="cu">USDT</small></b></div>
        <div class="row"><span data-i18n="withoutC"></span><b><span id="cp-without"></span><small class="cu">USDT</small></b></div>
        <div class="row total"><span data-i18n="moreLbl"></span><b><span id="cp-more"></span><small class="cu">USDT</small></b></div>
      </div>
    </div>
    <p class="disc" data-i18n="disc"></p>
  </section>
</main>

const TIERS=[{lo:100,hi:999.999999,r:.0036},{lo:1000,hi:9999.999999,r:.004},{lo:10000,hi:Infinity,r:.0045}];
const MIN=100,YEAR=365,MINC=100;
const tierIdx=c=>c>=10000?2:c>=1000?1:c>=100?0:-1;
const rate=c=>{const i=tierIdx(c);return i<0?0:TIERS[i].r};
function minCap(P){for(const T of TIERS){const c=Math.max(T.lo,Math.ceil(MINC/(T.r*P)));if(c<=T.hi)return c}return Infinity}

/* ---------- animations ---------- */
function tween(el,to,fmt){const from=el._v??to;el._v=to;cancelAnimationFrame(el._raf);if(reduce||from===to){el.textContent=fmt(to);return}
  const t0=performance.now(),dur=900;const step=n=>{const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=fmt(from+(to-from)*e);if(p<1)el._raf=requestAnimationFrame(step)};el._raf=requestAnimationFrame(step)}
function reels(el,str){
  const ch=[...str],nd=ch.filter(c=>/\d/.test(c)).length,ns=ch.length-nd,box=el.parentElement&&el.parentElement.parentElement,av=Math.max(160,(box?box.clientWidth:300)-36-58);el.style.fontSize=Math.max(22,Math.min(56,av/(nd*.68+ns*.34)))+"px";
  if(el._str===str)return;el._str=str;
  const shape=str.replace(/\d/g,"0");
  if(el._shape!==shape){el._shape=shape;const strip="<span class='strip'>"+"012345678901234567890123456789".split("").map(d=>"<span>"+d+"</span>").join("")+"</span>";
    el.innerHTML=[...str].map(c=>/\d/.test(c)?"<span class='reel'>"+strip+"</span>":"<span class='sep'>"+c+"</span>").join("")}
  const strips=el.querySelectorAll(".strip");let i=0;
  [...str].forEach(c=>{if(!/\d/.test(c))return;const s=strips[i++],d=+c,pd=s._d??0;
    if(reduce){s.style.transform="translateY("+(-(20+d)/30*100)+"%)";s._d=d;return}
    s.style.transition="none";s.style.transform="translateY("+(-pd/30*100)+"%)";void s.offsetHeight;
    s.style.transition="transform "+(950+i*70)+"ms cubic-bezier(.12,.8,.18,1)";s.style.transform="translateY("+(-(20+d)/30*100)+"%)";s._d=d});
}
function pulse(id){const h=$(id);h.classList.remove("pulse");void h.offsetWidth;h.classList.add("pulse")}

/* ---------- passive ---------- */
function renderStake(){
  const a=S.st.amt,ok=a>=MIN,r=ok?rate(a):0,d=a*r,ti=ok?tierIdx(a):-1;
  $("st-err").hidden=ok||!$("st-amt").value;$("st-err").textContent=t("minErr")+withLoc(100);$("st-box").classList.toggle("bad",!ok&&!!$("st-amt").value);
  $("st-res").classList.toggle("dim",!ok);
  document.querySelectorAll("[data-tier]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.tier===ti));
  
  reels($("st-mon"),money(d*30));
  tween($("st-dd"),d,money);
  tween($("st-w"),d*7,money);tween($("st-y"),d*365,money);tween($("st-grand"),ok?a+d*365:0,money);
  const be=ok?Math.ceil(1/r-1e-9):0;
  $("st-be").textContent=ok?t("beVal",{d:be,m:(be/30).toFixed(1)}):"—";
  const cw=ok?be/YEAR*100:0;$("st-cap").style.width=cw+"%";$("st-pro").style.left=cw+"%";$("st-pro").style.width=(ok?100-cw:0)+"%";
}

/* ---------- compounding ---------- */
const MAXN={1:364,7:52,30:12},UK={1:"u_day",7:"u_week",30:"u_month"};
function sim(c0,P,D){let cap=c0,acc=0,cash=0;const r0=rate(c0);
  for(let d=1;d<=YEAR;d++){const p=cap*rate(cap);if(d<=D){acc+=p;if(d%P===0){cap+=acc;acc=0}}else cash+=p}
  return{cap,daily:cap*rate(cap),cash,tot:cap+cash,plain:c0+c0*r0*YEAR}}
const rng=(a,b)=>a===b?t("day1",{d:a}):t("rng",{a,b});
function setFreq(P){const c=S.cp,n=Math.min(MAXN[P],Math.max(1,Math.round(c.D/P)));c.P=P;c.D=n*P}
function renderComp(){
  const c=S.cp,a=c.amt,ok=a>=MIN,r0=rate(a),en={},offs=[];
  $("cp-err").hidden=ok||!$("cp-amt").value;$("cp-err").textContent=t("minErr")+withLoc(100);$("cp-box").classList.toggle("bad",!ok&&!!$("cp-amt").value);
  [1,7,30].forEach(P=>{en[P]=ok&&a*r0*P>=MINC;if(ok&&!en[P])offs.push(t("fo_"+P,{m:nf0.format(minCap(P))})+withLoc(minCap(P)))});
  const any=en[1]||en[7]||en[30];
  if(any&&!en[c.P])setFreq(en[1]?1:en[7]?7:30);
  document.querySelectorAll("[data-every]").forEach(b=>{const P=+b.dataset.every;b.setAttribute("aria-pressed",P===c.P);b.setAttribute("aria-disabled",!en[P])});
  
  const ob=$("cp-offs");ob.hidden=!(any&&offs.length);
  ob.innerHTML=offs.map(s=>"<p>"+s+"</p>").join("")+"<p class='why'>"+t("offWhy")+"</p>";
  $("cp-empty").hidden=any||!ok;$("cp-empty").textContent=t("noneOk",{m:nf0.format(minCap(30))})+withLoc(minCap(30));
  $("cp-res").classList.toggle("dim",!any);$("cp-period").classList.toggle("dim",!any);
  const n=Math.round(c.D/c.P),mx=MAXN[c.P],rg=$("cp-range"),k=UK[c.P],dur=unit(k,n),left=YEAR-c.D;
  rg.max=mx;if(+rg.value!==n)rg.value=n;rg.style.setProperty("--p",((n-1)/(mx-1)*100)+"%");
  $("cp-rv").textContent=dur;$("cp-rsub").textContent=t("cashFor",{n:unit("u_day",left)});
  $("cp-min").textContent=unit(k,1);$("cp-max").textContent=unit(k,mx);
  const R=any?sim(a,c.P,c.D):{cap:0,daily:0,cash:0,tot:0,plain:0};
  $("s1r").textContent=rng(1,c.D);$("s1t").textContent=t("s1_t",{dur});
  $("s1a").textContent=money(a);tween($("s1b"),R.cap,money);
  $("s2r").textContent=rng(c.D+1,YEAR);$("s2s").textContent=money(R.daily)+" "+CU()+" × "+unit("u_day",left);
  tween($("s2v"),R.cash,money);
  reels($("cp-total"),money(R.tot));
  $("s3s").textContent=t("s3_s",{a:money(R.cap),b:money(R.cash)});
  tween($("cp-with"),R.tot,money);tween($("cp-without"),R.plain,money);
  tween($("cp-more"),Math.max(0,R.tot-R.plain),v=>"+"+money(v));
}

/* ---------- inputs ---------- */
function syncInputs(){
  const r=RT(),loc=LOC(),C=CUR[lc()];
  ["st","cp"].forEach(k=>{const el=$(k+"-amt");if(document.activeElement!==el)el.value=fmtInput(loc?Math.round(S[k].amt*r*100)/100:S[k].amt)});
  document.body.classList.toggle("rm",loc);document.body.classList.toggle("pre",loc&&!!C.pre);
  document.querySelectorAll(".cu").forEach(e=>e.textContent=CU());
  document.querySelectorAll(".loc-btn").forEach(b=>b.innerHTML="<span class='flag'>"+FLAG(C.flag)+"</span>"+C.lbl);
  document.querySelectorAll("[data-cur]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.cur===S.cur));
  document.querySelectorAll(".rate-in").forEach(i=>{if(document.activeElement!==i)i.value=fmtRate(r)});
  document.querySelectorAll(".rate-sym").forEach(e=>e.textContent=C.lbl);
  document.querySelectorAll("[data-usd]").forEach(b=>{const v=loc?niceUp(+b.dataset.usd*r):+b.dataset.usd;b.dataset.v=v;b.textContent=nf0.format(v);
    b.setAttribute("aria-pressed",Math.abs((loc?S[b.dataset.k].amt*r:S[b.dataset.k].amt)-v)<.5)});
}
function render(){syncInputs();renderStake();renderComp()}
function renderAll(){renderStake();renderComp();syncInputs()}
let deb;function renderSoon(){clearTimeout(deb);deb=setTimeout(renderAll,250)}

function applyLang(){
  document.documentElement.lang=S.lang==="zh"?"zh-CN":S.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  const l=LANGS.find(x=>x[0]===S.lang);$("langFlag").innerHTML=FLAG(l[1]);$("langCode").textContent=l[3];
  $("langGrid").innerHTML=LANGS.map(x=>"<button data-lang='"+x[0]+"' aria-pressed='"+(x[0]===S.lang)+"'><span class='flag'>"+FLAG(x[1])+"</span>"+x[2]+"</button>").join("");
  syncInputs();renderStake();renderComp();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="enterBtn"){document.body.classList.add("entered");setTimeout(()=>{pulse("st-hero");$("st-mon")._str=null;renderStake()},700);return}
  if(b.id==="langBtn"){$("sheet").classList.add("open");return}
  if(b.dataset.lang){S.lang=b.dataset.lang;save();applyLang();setTimeout(()=>$("sheet").classList.remove("open"),160);return}
  if(b.dataset.tab){const on=b.dataset.tab;S.tab=+on;$("seg").dataset.on=on;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===on));
    $("p0").classList.toggle("on",on==="0");$("p1").classList.toggle("on",on==="1");
    if(on==="0"){$("st-mon")._str=null;renderStake();pulse("st-hero")}else{$("cp-total")._str=null;renderComp();pulse("cp-hero")}
    window.scrollTo({top:0});return}
  if(b.dataset.tier){S.st.amt=+b.dataset.set;render();pulse("st-hero");return}
  if(b.dataset.usd){S[b.dataset.k].amt=LOC()?+b.dataset.v/RT():+b.dataset.usd;$(b.dataset.k==="st"?"st-mon":"cp-total")._str=null;render();pulse(b.dataset.k==="st"?"st-hero":"cp-hero");return}
  if(b.dataset.cur){if(b.dataset.cur!==S.cur){S.cur=b.dataset.cur;save();$("st-mon")._str=null;$("cp-total")._str=null;render()}return}
  if(b.dataset.every){if(b.getAttribute("aria-disabled")==="true"){b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");return}
    setFreq(+b.dataset.every);renderComp();return}
  if(b.dataset.step){const c=S.cp,n=Math.round(c.D/c.P)+ +b.dataset.step;c.D=Math.min(MAXN[c.P],Math.max(1,n))*c.P;renderComp();return}
});
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("sheet").classList.remove("open")});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="st-amt"||el.id==="cp-amt"){el.value=fmtInput(el.value);const v=parseNum(el.value);S[el.id.slice(0,2)].amt=LOC()?v/RT():v;renderSoon();return}
  if(el.classList.contains("rate-in")){const v=parseNum(el.value);if(v>0){S.rates[lc()]=v;save();renderSoon()}return}
  if(el.id==="cp-range"){S.cp.D=+el.value*S.cp.P;renderComp();return}
});
document.addEventListener("focusout",e=>{if(e.target.matches("input"))setTimeout(syncInputs,0)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input"))e.target.blur();if(e.key==="Escape")$("sheet").classList.remove("open")});
/* block pinch & double-tap zoom */
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});

/* ---------- sparks ---------- */
(()=>{const cv=$("sparks"),cx=cv.getContext("2d");let W,H,P=[],run=true;
  function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
  const mk=init=>({x:Math.random()*W,y:init?Math.random()*H:H+10,r:Math.random()*1.5+.4,v:Math.random()*.32+.1,a:Math.random()*.55+.2,w:Math.random()*6.28,s:Math.random()*.012+.004});
  size();addEventListener("resize",size);for(let i=0;i<34;i++)P.push(mk(true));
  function draw(){if(!run)return;cx.clearRect(0,0,W,H);cx.globalCompositeOperation="lighter";
    for(const p of P){p.y-=p.v;p.w+=p.s;const x=p.x+Math.sin(p.w)*10,f=Math.min(1,p.y/H*1.6);cx.beginPath();cx.arc(x,p.y,p.r,0,6.283);cx.fillStyle="rgba(255,"+(60+p.r*30|0)+","+(70+p.r*20|0)+","+(p.a*f)+")";cx.fill();
      if(p.y<-10)Object.assign(p,mk(false))}
    requestAnimationFrame(draw)}
  if(!reduce)draw();document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run&&!reduce)draw()});
})();

/* ---------- PWA ---------- */
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude|anthropic/.test(location.hostname)){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

syncInputs();applyLang();
})();
</script>
