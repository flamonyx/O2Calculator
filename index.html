<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O2Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#FE2C39; --coral:#FC826A;
  --grad:linear-gradient(125deg,#FC826A 0%,#FD5A50 45%,#FE2C39 100%);
  --red-soft:rgba(254,44,57,.08);
  --bg:#F6F3F3; --surface:#FFFFFF; --surface-2:#FBF8F8; --ink:#25211F; --muted:#7D7073; --line:#EEE4E4;
  --sf:system-ui;
  --font:"Poppins",var(--sf),"Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#18141A; --surface:#231E25; --surface-2:#2B252D; --ink:#F7F1F1; --muted:#B1A3A8; --line:#3A3239;
    --red-soft:rgba(254,44,57,.16); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18141A; --surface:#231E25; --surface-2:#2B252D; --ink:#F7F1F1; --muted:#B1A3A8; --line:#3A3239;
  --red-soft:rgba(254,44,57,.16); color-scheme:dark;
}
html[lang="th"]{--sf:"Noto Sans Thai"}
html[lang="ja"]{--sf:"Noto Sans JP"}
html[lang="ko"]{--sf:"Noto Sans KR"}
html[lang="zh"]{--sf:"Noto Sans SC"}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.5;overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient svg{position:absolute;fill:none;stroke:var(--red)}
.ambient .a1{width:760px;height:760px;right:-300px;top:-260px;opacity:.08;animation:spin 90s linear infinite}
.ambient .a2{width:560px;height:560px;left:-260px;bottom:-240px;opacity:.06;animation:spin 120s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}

.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 16px 36px}

/* header */
header{padding:14px 0 0;position:relative;z-index:10}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:5}
.logo{height:44px;width:auto;display:block;overflow:visible}
.logo .ring{transform-origin:28px 32px;animation:ringIn 1.1s cubic-bezier(.2,.9,.25,1.15) both}
.logo .sup{font:700 19px var(--font);animation:pop .5s .7s cubic-bezier(.3,1.6,.4,1) both;transform-origin:47px 14px}
.logo .wm{font:600 36px var(--font);letter-spacing:-.5px;animation:wmIn .7s .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{transform:rotate(-220deg) scale(.3);opacity:0}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes wmIn{from{opacity:0;transform:translateX(-14px)}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* language picker */
.lang{position:relative;animation:fade .6s .6s both}
.langbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;height:40px;padding:0 12px 0 10px;cursor:pointer;font-size:14px;font-weight:600}
.langbtn[aria-expanded="true"]{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.langbtn .chev{width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg);margin-left:2px;transition:transform .25s}
.langbtn[aria-expanded="true"] .chev{transform:translateY(2px) rotate(225deg)}
.flag{width:24px;height:16px;border-radius:3px;overflow:hidden;flex:none;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.flag svg{width:100%;height:100%;display:block}
.langlist{position:absolute;right:0;top:calc(100% + 8px);z-index:30;list-style:none;margin:0;padding:6px;min-width:214px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);animation:drop .2s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.langlist li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;outline:none}
.langlist li:hover,.langlist li:focus{background:var(--surface-2)}
.langlist li[aria-selected="true"]{background:var(--red-soft);color:var(--red);font-weight:600}

/* tabs */
.tabs{display:flex;gap:6px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;position:relative;animation:fade .6s .7s both}
.tab{flex:1;border:0;background:none;padding:11px 8px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer;position:relative;z-index:1;color:var(--muted);transition:color .25s}
.tab[aria-selected="true"]{color:#fff}
.tab-ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 8px);background:var(--grad);border-radius:12px;transition:transform .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 8px 20px -10px var(--red)}

main{margin-top:16px;animation:fade .6s .8s both}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:880px){.grid{grid-template-columns:380px minmax(0,1fr);align-items:start}.inputs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}}
.stack{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px}
.flabel{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px}

/* amount */
.field{margin-bottom:20px}
.inbox{display:flex;align-items:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;transition:border-color .2s,box-shadow .2s}
.inbox:focus-within{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.inbox.bad{border-color:var(--red)}
.inbox input{flex:1;min-width:0;width:100%;border:0;background:none;outline:none;padding:12px 0;font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.inbox .suf{font-size:13px;color:var(--muted);font-weight:600;margin-left:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:border-color .2s,color .2s,transform .15s}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip:active{transform:scale(.94)}
.err{font-size:13px;color:var(--red);font-weight:500;margin-top:8px}

/* tiers */
.tiers{display:grid;gap:7px}
.tier{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:10px 13px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);transition:border-color .3s,background .3s,box-shadow .3s}
.tier .rg{font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.tier .tg{font-size:11.5px;font-weight:600;color:#fff;background:var(--grad);border-radius:99px;padding:2px 9px;opacity:0;transform:scale(.6);transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.4,1);white-space:nowrap}
.tier .rt{text-align:right;line-height:1.15}
.tier .rt b{display:block;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.tier .rt span{font-size:11.5px;color:var(--muted)}
.tier.on{border-color:var(--red);background:var(--red-soft);box-shadow:0 8px 18px -12px var(--red)}
.tier.on .tg{opacity:1;transform:scale(1)}
.tier.on .rt b{color:var(--red)}

/* hero */
.hero{background:var(--grad);color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 22px 40px -26px rgba(254,44,57,.75)}
.hero .deco{position:absolute;right:-70px;top:-70px;width:250px;height:250px;opacity:.22;pointer-events:none}
.hero .deco circle{fill:none;stroke:#fff}
.hero .deco .arc{animation:spin 14s linear infinite;transform-origin:125px 125px}
.hero .lbl{font-size:14px;font-weight:500;opacity:.92;position:relative}
.big{font-weight:800;font-size:clamp(36px,10vw,56px);line-height:1.05;letter-spacing:-.025em;font-variant-numeric:tabular-nums;position:relative;margin-top:2px;overflow-wrap:anywhere}
.big small{font-size:.34em;font-weight:600;letter-spacing:0;margin-left:6px;opacity:.85}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;border-top:1px solid rgba(255,255,255,.28);padding-top:14px;position:relative}
.trio div{padding:0 10px;min-width:0}
.trio div:first-child{padding-left:0}
.trio div+div{border-left:1px solid rgba(255,255,255,.28)}
.trio span{display:block;font-size:12.5px;opacity:.88;line-height:1.3}
.trio b{display:block;font-weight:700;font-size:clamp(15px,4.2vw,21px);font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:3px;overflow-wrap:anywhere}

/* break-even rail */
.lbl2{font-size:14px;color:var(--muted);font-weight:500}
.mid{font-weight:700;font-size:28px;line-height:1.15;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.rail{position:relative;height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;margin:18px 0 30px}
.rail .f1{position:absolute;left:0;top:0;bottom:0;border-radius:99px 0 0 99px;background:var(--ink);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.rail .f2{position:absolute;top:0;bottom:0;right:0;border-radius:0 99px 99px 0;background:var(--grad);left:0;transition:left .7s cubic-bezier(.2,.8,.2,1)}
.rail .pin{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;background:var(--surface);border:4px solid var(--red);border-radius:50%;left:0;transition:left .7s cubic-bezier(.2,.8,.2,1)}
.rail .end{position:absolute;top:19px;font-size:12px;color:var(--muted);font-weight:500}
.rail .end.s{left:0}.rail .end.e{right:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14.5px;padding-top:12px;margin-top:14px;border-top:1px solid var(--line)}
.line b{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* compare bars */
.cmp{margin-top:14px}
.cmp:first-of-type{margin-top:4px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;font-weight:500;margin-bottom:6px}
.ch b{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ch b.red{color:var(--red)}
.bar{display:flex;height:16px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .bc{background:var(--ink)}
.bar .br{background:var(--grad)}
.badge{display:inline-block;margin-top:14px;background:var(--grad);color:#fff;font-weight:600;font-size:13.5px;border-radius:99px;padding:5px 13px}
.cmpcard .legend{margin-top:12px}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;white-space:nowrap;border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:14.5px;cursor:pointer;transition:transform .15s,filter .2s;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn svg{width:18px;height:18px;flex:none}
.disc{font-size:12.5px;color:var(--muted);margin:0 2px;text-align:center}

/* frequency */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);transition:background .25s,color .25s,opacity .25s}
.seg button[aria-checked="true"]{background:var(--grad);color:#fff;box-shadow:0 6px 14px -8px var(--red)}
.seg button[aria-disabled="true"]{opacity:.42;cursor:not-allowed;text-decoration:line-through;text-decoration-thickness:1.5px}
.seg button.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.offs{margin-top:9px;font-size:12.8px;line-height:1.5;color:var(--red);background:var(--red-soft);border-radius:12px;padding:9px 12px}
.offs p{margin:0}
.offs p.why{color:var(--muted);margin-top:4px}

/* duration slider */
.range{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer;--p:50%}
.range::-webkit-slider-runnable-track{height:14px;border-radius:99px;background:linear-gradient(90deg,var(--ink) 0 var(--p),var(--red) var(--p) 100%)}
.range::-moz-range-track{height:14px;border-radius:99px;background:linear-gradient(90deg,var(--ink) 0 var(--p),var(--red) var(--p) 100%)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-7px;border-radius:50%;background:var(--surface);border:5px solid var(--red);box-shadow:0 4px 12px -4px rgba(0,0,0,.35);transition:transform .15s}
.range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--surface);border:5px solid var(--red);box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.range:active::-webkit-slider-thumb{transform:scale(1.12)}
.range:focus-visible{outline:none}
.range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px var(--red-soft)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.split div{border-radius:14px;padding:10px 12px;border:1.5px solid var(--line)}
.split .sl{border-color:var(--ink)}
.split .sr{border-color:var(--red);background:var(--red-soft)}
.split span{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.split b{display:block;font-weight:700;font-size:18px;line-height:1.25;font-variant-numeric:tabular-nums}
.split .sr b{color:var(--red)}
.split em{display:block;font-style:normal;font-size:12px;color:var(--muted)}


/* compounding steps */
.steps{padding:22px 20px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;position:relative;padding-bottom:24px}
.step:not(.last)::before{content:"";position:absolute;left:16px;top:40px;bottom:6px;width:2px;background:var(--line)}
.step.last{padding-bottom:0}
.dot{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;box-shadow:0 6px 14px -8px var(--red)}
.rng{display:block;font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.3}
.st{display:block;font-size:17px;font-weight:700;line-height:1.35}
.ss{margin:2px 0 10px;font-size:13.5px;color:var(--muted);line-height:1.45}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-variant-numeric:tabular-nums}
.flow span{font-weight:600;font-size:16px;color:var(--muted)}
.flow svg{width:20px;height:20px;fill:none;stroke:var(--red);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flow b{font-weight:700;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.flow small{font-size:12px;font-weight:600;color:var(--muted);margin-left:-4px}
.flow.red{background:var(--red-soft);border-color:transparent}
.flow.red span{font-size:14px;font-weight:500}
.flow.red b{color:var(--red);margin-left:auto}
.total{background:var(--grad);color:#fff;border-radius:18px;padding:14px 18px 16px;margin-top:4px;box-shadow:0 22px 40px -26px rgba(254,44,57,.75)}
.total>span{font-size:14px;font-weight:500;opacity:.92}
.total .big{font-size:clamp(32px,9vw,46px)}
.total p{margin:6px 0 0;font-size:13px;opacity:.92;font-variant-numeric:tabular-nums}
.bar .br,.bar .bc{border-radius:99px}
.dim{opacity:.38;pointer-events:none;filter:grayscale(.6);transition:opacity .3s,filter .3s}
.emptymsg{font-size:14px;font-weight:500;color:var(--red);background:var(--red-soft);border-radius:14px;padding:12px 14px;margin:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:all .3s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.03)}}

@media (max-width:420px){
  .card{padding:16px;border-radius:20px}
  .logo{height:38px}
  .langbtn .nm{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .ambient{display:none}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <svg class="a1" viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" stroke-width="1"/><circle cx="100" cy="100" r="80" stroke-width="7" stroke-dasharray="380 123"/><circle cx="100" cy="100" r="62" stroke-width="1.2" stroke-dasharray="2 5"/></svg>
  <svg class="a2" viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" stroke-width="6" stroke-dasharray="420 170"/><circle cx="100" cy="100" r="74" stroke-width="1"/></svg>
</div>

<div class="wrap">
  <header>
    <div class="top">
      <svg class="logo" viewBox="0 0 252 60" role="img" aria-label="O2Calculator">
        <defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="252" y2="0"><stop offset="0" stop-color="#FC826A"/><stop offset="1" stop-color="#FE2C39"/></linearGradient></defs>
        <g class="ring">
          <circle cx="28" cy="32" r="22" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="110 28.2" transform="rotate(-6 28 32)"/>
          <circle cx="28" cy="32" r="12.5" fill="none" stroke="url(#lg)" stroke-width="4.5"/>
        </g>
        <text class="sup" x="42" y="18" fill="url(#lg)">2</text>
        <text class="wm" x="58" y="45" fill="url(#lg)">calculator</text>
      </svg>
      <div class="lang" id="lang">
        <button class="langbtn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Language"><span class="flag" id="langFlag"></span><span class="nm" id="langName"></span><span class="chev" aria-hidden="true"></span></button>
        <ul class="langlist" id="langList" role="listbox" aria-label="Language" hidden></ul>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <span class="tab-ind" id="tabInd"></span>
      <button class="tab" role="tab" id="t-p" aria-selected="true" aria-controls="p-p" data-i18n="tab_p"></button>
      <button class="tab" role="tab" id="t-c" aria-selected="false" aria-controls="p-c" data-i18n="tab_c"></button>
    </div>
  </header>

  <main>
    <!-- PASSIVE -->
    <section id="p-p" role="tabpanel" aria-labelledby="t-p">
      <div class="grid">
        <div class="inputs card">
          <div class="field">
            <label class="flabel" for="amt" data-i18n="amt_label"></label>
            <div class="inbox" id="amtBox"><input id="amt" inputmode="decimal" autocomplete="off" value="1,000" placeholder="1,000"><span class="suf">USDT</span></div>
            <div class="err" id="amtErr" hidden data-i18n="min_err"></div>
            <div class="chips" data-target="amt">
              <button class="chip" data-v="100">100</button>
              <button class="chip" data-v="500">500</button>
              <button class="chip" data-v="1000">1K</button>
              <button class="chip" data-v="5000">5K</button>
              <button class="chip" data-v="10000">10K</button>
              <button class="chip" data-v="50000">50K</button>
            </div>
          </div>
          <span class="flabel" data-i18n="tier_lbl"></span>

  range.setAttribute('aria-valuetext',dur);
  var R=any?sim(c0,st.P,D):{cap:0,daily:0,cash:0,tot:0,plain:0};
  $('s1r').textContent=rng(1,D);$('s1t').textContent=t('s1_t',{dur:dur});
  $('s1a').textContent=fc(c0);tween($('s1b'),R.cap,fc);
  $('s2r').textContent=rng(D+1,YEAR);
  $('s2s').textContent=fc(R.daily)+' USDT × '+unit('u_day',left);
  tween($('s2v'),R.cash,fc);tween($('s3v'),R.tot,fc);
  $('s3s').textContent=t('s3_s',{a:fc(R.cap),b:fc(R.cash)});
  tween($('cTot'),R.tot,fc);tween($('cPlain'),R.plain,fc);
  var mx=Math.max(R.tot,R.plain)||1;
  $('bW').style.width=(R.tot/mx*100)+'%';$('bN').style.width=(R.plain/mx*100)+'%';
  var diff=R.tot-R.plain;$('cExtra').textContent=t('extra',{x:fc(diff)});$('cExtra').hidden=!(diff>0.005);
  if(!any){$('waC')._s='';return}
  var s=['O2Calculator | '+t('tab_c'),
    '1) '+t('s1_t',{dur:dur})+': '+fc(c0)+' → '+fc(R.cap)+' USDT',
    '2) '+t('s2_t')+': '+fc(R.daily)+' USDT × '+unit('u_day',left)+' = '+fc(R.cash)+' USDT',
    '3) '+t('s3_t')+': '+fc(R.tot)+' USDT',
    t('bar_without')+': '+fc(R.plain)+' USDT ('+t('extra',{x:fc(diff)})+')'].join('\n');
  $('waC').href='https://wa.me/?text='+encodeURIComponent(s);$('waC')._s=s;
}

/* ---------- language picker ---------- */
var lb=$('langBtn'),ll=$('langList');
ll.innerHTML=LANGS.map(function(L){return '<li role="option" tabindex="-1" data-v="'+L.v+'" aria-selected="false"><span class="flag">'+FLAG(L.f)+'</span>'+L.n+'</li>'}).join('');
var opts=[].slice.call(ll.children);
function openList(){ll.hidden=false;lb.setAttribute('aria-expanded','true');var cur=ll.querySelector('[aria-selected="true"]')||opts[0];cur.focus()}
function closeList(f){ll.hidden=true;lb.setAttribute('aria-expanded','false');if(f)lb.focus()}
lb.addEventListener('click',function(){ll.hidden?openList():closeList()});
ll.addEventListener('click',function(e){var o=e.target.closest('li');if(!o)return;applyLang(o.dataset.v);closeList(true)});
ll.addEventListener('keydown',function(e){
  var i=opts.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();opts[Math.min(opts.length-1,i+1)].focus()}
  else if(e.key==='ArrowUp'){e.preventDefault();opts[Math.max(0,i-1)].focus()}
  else if(e.key==='Enter'||e.key===' '){e.preventDefault();if(i>=0){applyLang(opts[i].dataset.v);closeList(true)}}
  else if(e.key==='Escape'||e.key==='Tab'){closeList(e.key==='Escape')}
});
lb.addEventListener('keydown',function(e){if(e.key==='ArrowDown'){e.preventDefault();openList()}});
document.addEventListener('click',function(e){if(!ll.hidden&&!$('lang').contains(e.target))closeList()});

function applyLang(l){
  if(!T[l])l='ms';lang=l;
  document.documentElement.lang=l;
  var L=LANGS.filter(function(x){return x.v===l})[0];
  $('langFlag').innerHTML=FLAG(L.f);$('langName').textContent=L.n;
  opts.forEach(function(o){o.setAttribute('aria-selected',o.dataset.v===l)});
  if(FONTS[l]&&!loaded[l]){var k=document.createElement('link');k.rel='stylesheet';k.href='https://fonts.googleapis.com/css2?family='+FONTS[l]+'&display=swap';document.head.appendChild(k);loaded[l]=1}
  [].forEach.call(document.querySelectorAll('[data-i18n]'),function(el){el.textContent=t(el.dataset.i18n)});
  try{localStorage.setItem('o2lang',l)}catch(e){}
  calcP();calcC();
}

/* ---------- init ---------- */
var startLang='ms';
try{var q=new URLSearchParams(location.search).get('lang');var sv=localStorage.getItem('o2lang');startLang=(q&&T[q])?q:(sv&&T[sv])?sv:'ms'}catch(e){}
setFreq(1);
applyLang(startLang);
try{if(+localStorage.getItem('o2tab')===1)showTab(1)}catch(e){}
})();
</script>
